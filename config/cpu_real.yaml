# =============================================================================
# CPU-feasible REAL-DATA training configuration.
#
# This config trains on the COMPLETE training split (all 1,352 training images
# from 43 subjects) and validates on the complete validation split (296 images
# from 9 subjects) — no sample caps. It is a genuine training run, not a smoke
# test.
#
# The only concessions to running on a single CPU core are REDUCED CAPACITY,
# and they are stated explicitly rather than hidden:
#   - input resolution 128x128 instead of the dataset's native 256x256
#   - base_channels 16 instead of 32
#   - 15 epochs instead of 60
#
# Results from this config are therefore a real but CAPACITY-LIMITED lower
# bound on what the architecture can do. They are written to
# outputs/metrics/*_cpu_real.* and must not be presented as the model's
# achievable performance. For that, use config.yaml on a GPU:
#     python scripts/train.py --mode full
# See README "Full training on a GPU".
# =============================================================================

seed: 42
data:
  images_dir: data/lung-cancer-vision-v1/images
  masks_dir: data/lung-cancer-vision-v1/masks
  image_size: 128
  val_fraction: 0.15
  test_fraction: 0.15
  split_level: subject
  mask_threshold: 127
  normalization: zscore_dataset
  use_clahe: false
  clahe_clip_limit: 2.0
  clahe_tile_grid: 8
model:
  name: unet
  in_channels: 1
  out_channels: 1
  base_channels: 16
  bilinear_upsampling: true
training:
  smoke_test:
    epochs: 2
    batch_size: 4
    max_train_samples: 64
    max_val_samples: 16
    num_workers: 0
  full:
    epochs: 10
    batch_size: 8
    num_workers: 0
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  optimizer: adam
  momentum: 0.9
  lr_scheduler: reduce_on_plateau
  scheduler_patience: 3
  scheduler_step_size: 10
  early_stopping_patience: 15
  device: cpu
  mixed_precision: true
  grad_clip_norm: null
loss:
  name: bce_dice
  bce_weight: 0.5
  dice_weight: 0.5
  dice_smooth: 1.0
  empty_handling: smooth
  pos_weight: null
augmentation:
  enabled: true
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.0
  rotation_degrees: 10
  translate_fraction: 0.05
  scale_range:
  - 0.95
  - 1.05
  affine_prob: 0.7
  brightness_contrast_prob: 0.3
  brightness_limit: 0.1
  contrast_limit: 0.1
  gauss_noise_prob: 0.2
  gauss_noise_std_range:
  - 0.01
  - 0.05
evaluation:
  threshold: 0.5
  compute_surface_metrics: true
error_analysis:
  low_dice_threshold: 0.5
  low_iou_threshold: 0.35
  high_fp_pixel_threshold: 500
  high_fn_pixel_threshold: 500
  n_worst_to_report: 20
experiments:
- name: baseline_unet_no_aug
  model: unet
  augmentation: false
  loss: bce
- name: unet_aug_bce_dice
  model: unet
  augmentation: true
  loss: bce_dice
paths:
  checkpoints_dir: outputs/checkpoints
  figures_dir: outputs/figures
  predictions_dir: outputs/predictions
  metrics_dir: outputs/metrics
